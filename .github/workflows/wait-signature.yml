name: OSSign Signing Wait Loop

# Polls OSSign for a previously-dispatched Windows signing request and, once it completes,
# downloads the signed artifacts and attaches them to the matching GitHub Release.
#
# Why a self-re-dispatching loop instead of a single waiting job? OSSign's signing requires a
# manual reviewer approval on their side that can take *hours*. GitHub Actions cannot pause a
# job cheaply, so we exploit the "Signatures" environment's Wait timer: each run waits out the
# timer (consuming no runner minutes while queued), does one status check, and—if not yet
# done—re-dispatches itself for the next interval. Total max wait = wait_timer * max_attempts.
#
# Started by the build-windows job in build-and-sign.yml. See .github/ossign/README.md.

on:
  workflow_dispatch:
    inputs:
      workflow_id:
        description: 'The OSSign dispatch workflow id to poll'
        required: true
        type: string
      target_ref:
        description: 'Ref the signed artifacts belong to. A vX.Y.Z tag is attached to that GitHub Release; anything else is kept only as a workflow artifact.'
        required: true
        type: string
      attempt:
        description: 'Current attempt number'
        required: false
        type: number
        default: 1
      max_attempts:
        description: 'Max attempts. wait_timer (20 min) * max_attempts = max total wait (72 -> ~24h).'
        required: false
        type: number
        default: 72

permissions:
  contents: write # attach assets to the release
  actions: write # re-dispatch this workflow for the next poll

jobs:
  wait-and-check:
    runs-on: ubuntu-latest
    # The Wait timer protection rule on this environment provides the polling interval.
    # It must have NO required reviewers, or every poll iteration would block on approval.
    environment: Signatures
    timeout-minutes: 10

    steps:
      - name: Enforce attempt ceiling
        run: |
          set -euo pipefail
          if [ "${{ inputs.attempt }}" -gt "${{ inputs.max_attempts }}" ]; then
            echo "::error::OSSign signing did not complete within ${{ inputs.max_attempts }} attempts (~$(( ${{ inputs.max_attempts }} * 20 / 60 ))h). Giving up."
            exit 1
          fi
          echo "Attempt ${{ inputs.attempt }} of ${{ inputs.max_attempts }} for OSSign workflow ${{ inputs.workflow_id }}."

      - name: Check OSSign signing status
        id: check
        # Pinned to a commit SHA (not a mutable @main) — this action receives OSSIGN_TOKEN,
        # so a moving ref is a supply-chain risk. Bump deliberately (e.g. via Dependabot).
        uses: ossign/actions/workflow/dispatch@fbf0b39466d9409f05d1efc0e58cc3e4615ac625 # OSSign/actions main @ 2025-10-09
        with:
          username: ${{ secrets.OSSIGN_USER }}
          token: ${{ secrets.OSSIGN_TOKEN }}
          single_check: ${{ inputs.workflow_id }}

      - name: Download signed artifacts
        if: steps.check.outputs.signed_artifacts != ''
        env:
          SIGNED_ARTIFACTS: ${{ steps.check.outputs.signed_artifacts }}
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "${SIGNED_ARTIFACTS}" | jq -r '.[] | [.name, .browser_download_url] | @tsv' \
            | while IFS=$'\t' read -r name url; do
                echo "Downloading signed artifact: ${name}"
                curl -fSL "${url}" -o "dist/${name}"
              done
          echo "Downloaded signed artifacts:"
          ls -l dist

      - name: Upload workflow artifact
        if: steps.check.outputs.signed_artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts-signed
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
          retention-days: 90

      - name: Verify artifacts match the target ref
        # The OSSign action has no success/failure output: when the polled signing run has
        # FAILED, single_check has been observed to return the project's *previous* successful
        # artifacts instead of nothing (2026-07-12: a failed v1.8.2-rc.1 run yielded June's
        # 1.8.1 build, which was silently attached to the draft release). Guard by checking
        # that the electron-updater metadata version matches the tag before attaching.
        if: steps.check.outputs.signed_artifacts != '' && startsWith(inputs.target_ref, 'v')
        run: |
          set -euo pipefail
          expected="${{ inputs.target_ref }}"
          expected="${expected#v}"
          if [ ! -f dist/latest.yml ]; then
            echo "::error::No latest.yml among signed artifacts; cannot verify they belong to ${{ inputs.target_ref }}. Refusing to attach."
            exit 1
          fi
          actual=$(awk '/^version:/ {print $2; exit}' dist/latest.yml)
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::OSSign returned artifacts for version '${actual}' but the target ref is '${{ inputs.target_ref }}'. The OSSign build likely failed and stale artifacts were returned. Refusing to attach."
            exit 1
          fi
          echo "Artifact version ${actual} matches ${{ inputs.target_ref }}."

      - name: Reconcile signed artifacts with latest.yml
        # electron-updater downloads *exactly* the filenames latest.yml declares, resolved against
        # the release's download path — so the payload names and the manifest have to agree byte
        # for byte. They don't, by default: electron-builder writes manifest URLs with spaces
        # normalized to '-' (and its own publisher uploads under that name), while artifacts that
        # travel through GitHub's asset API — as OSSign's do — come back with spaces sanitized to
        # '.'. v1.8.2 shipped that way: latest.yml pointed at Invoke-Community-Edition-Setup-1.8.2.exe
        # while the attached asset was Invoke.Community.Edition.Setup.1.8.2.exe, so every Windows
        # user's update 404'd. Rename the payloads to what the manifest declares ('-' survives
        # GitHub's sanitizer untouched) and verify the digests, so a mismatch fails the build here
        # instead of on users' machines.
        #
        # Ordering matters: this runs AFTER "Upload workflow artifact" so that a rejection here
        # still leaves the hours-of-signing binaries in the 90-day archive, and AFTER the stale-
        # version check so that recycled artifacts are reported as such rather than as a name
        # mismatch. It is tag-gated like the attach step below — on non-tag runs nothing is
        # attached, so there is nothing to reconcile.
        if: steps.check.outputs.signed_artifacts != '' && startsWith(inputs.target_ref, 'v')
        working-directory: dist
        run: |
          set -euo pipefail

          # The previous step already rejected a tag run without latest.yml; belt and braces.
          if [ ! -f latest.yml ]; then
            echo "::error::No latest.yml among the signed artifacts; cannot reconcile names."
            exit 1
          fi

          # Compare names ignoring the separator characters the two sanitizers disagree about.
          norm() { printf '%s' "$1" | sed 's/%20/-/g; s/[ .]/-/g'; }

          # Emit one "<url>\t<sha512>" line per files[] entry. The trailing top-level sha512 (which
          # duplicates files[0]) can't clobber an entry: sha is only taken when still unset.
          entries=$(awk '
            /^[[:space:]]*-[[:space:]]*url:/ {
              if (u != "") { print u "\t" s }
              sub(/^[[:space:]]*-[[:space:]]*url:[[:space:]]*/, ""); u = $0; s = ""
              next
            }
            /^[[:space:]]*sha512:/ && u != "" && s == "" {
              sub(/^[[:space:]]*sha512:[[:space:]]*/, ""); s = $0
            }
            END { if (u != "") { print u "\t" s } }
          ' latest.yml)

          if [ -z "${entries}" ]; then
            echo "::error::latest.yml declares no files[] entries; cannot verify what the updater will fetch."
            exit 1
          fi

          # Names already assigned to an earlier entry, so a later entry cannot rename them away.
          claimed=""

          while IFS=$'\t' read -r want sha; do
            [ -n "${want}" ] || continue

            # For provider 'github' electron-builder always writes a GitHub-safe url. If that ever
            # stops being true, renaming a payload to an unsafe name would recreate the very 404
            # this step exists to prevent, with a green build. Refuse instead of renaming.
            case "${want}" in
              *[!0-9A-Za-z._-]*)
                echo "::error::latest.yml declares '${want}', which contains characters GitHub's asset API rewrites on upload. The updater could not fetch it under that name. Refusing to attach."
                exit 1
                ;;
            esac

            if [ -e "${want}" ] && [ ! -f "${want}" ]; then
              echo "::error::'${want}' exists in the artifact set but is not a regular file. Refusing to attach."
              exit 1
            fi

            if [ ! -f "${want}" ]; then
              key=$(norm "${want}")
              found=""
              for f in *; do
                [ -f "${f}" ] || continue
                if case "${claimed}" in *"|${f}|"*) true;; *) false;; esac; then
                  continue
                fi
                [ "$(norm "${f}")" = "${key}" ] || continue
                found="${f}"
                break
              done
              if [ -z "${found}" ]; then
                echo "::error::latest.yml declares '${want}' but no downloaded artifact matches it, even ignoring '.'/' ' separators. Refusing to attach a release the updater cannot download."
                exit 1
              fi
              echo "Renaming '${found}' -> '${want}' to match latest.yml"
              mv -- "${found}" "${want}"
              # electron-updater derives the differential-download blockmap URL by appending
              # .blockmap to the declared filename, so it has to follow the installer's new name.
              if [ -f "${found}.blockmap" ]; then
                mv -- "${found}.blockmap" "${want}.blockmap"
              fi
            fi
            claimed="${claimed}|${want}|"

            if [ -n "${sha}" ]; then
              actual=$(openssl dgst -sha512 -binary "${want}" | base64 -w0)
              if [ "${actual}" != "${sha}" ]; then
                echo "::error::'${want}' does not match the sha512 in latest.yml (expected ${sha}, got ${actual}). electron-updater would reject this download. Refusing to attach."
                exit 1
              fi
            fi

            echo "Verified: ${want}"
          done <<< "${entries}"

          echo "Artifacts after reconciliation:"
          ls -l

      - name: Attach signed artifacts to the release
        # Only for vX.Y.Z tags — the release is created by the linux/macOS publish jobs. For
        # non-tag (manual test) runs there is no release, so we stop at the workflow artifact above.
        if: steps.check.outputs.signed_artifacts != '' && startsWith(inputs.target_ref, 'v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.exe dist/*.blockmap dist/*.yml dist/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No signed Windows files found to attach to release ${{ inputs.target_ref }}"
            exit 1
          fi
          echo "Attaching to release ${{ inputs.target_ref }}: ${files[*]}"
          # --repo is required: this job does not checkout, so gh has no local git context to infer it from.
          gh release upload "${{ inputs.target_ref }}" "${files[@]}" --clobber --repo "${{ github.repository }}"

      - name: Not finished — schedule the next poll
        if: steps.check.outputs.signed_artifacts == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          next=$(( ${{ inputs.attempt }} + 1 ))
          echo "OSSign signing not finished yet; scheduling attempt ${next}."
          # --repo is required: this job does not checkout, so gh has no local git context to infer it from.
          gh workflow run wait-signature.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f workflow_id="${{ inputs.workflow_id }}" \
            -f target_ref="${{ inputs.target_ref }}" \
            -f attempt="${next}" \
            -f max_attempts="${{ inputs.max_attempts }}"
